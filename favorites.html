<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;--r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter'; direction: ltr; unicode-bidi: isolate; }
.site-header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: 'Inter'; font-weight: 800; letter-spacing: 1.5px; }
.back-link { color: #fff; text-decoration: none; font-size: 1.2rem; width: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  overflow: hidden; box-shadow: var(--sh-sm); text-decoration: none; color: var(--text); position: relative;
}
.card img { width: 100%; height: 130px; object-fit: cover; background: var(--n100); display: block; }
.remove-btn {
  position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.92); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.remove-btn svg { width: 13px; height: 13px; stroke: var(--primary); }
.card-body { padding: 10px; }
.card-body h3 { font-size: 0.88rem; margin-bottom: 4px; font-weight: 700; }
.price { color: var(--primary); font-weight: 800; font-size: 0.9rem; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); grid-column: 1/-1; }
.empty a { color: var(--primary); font-weight: 700; text-decoration: none; }
.loading { text-align: center; padding: 70px 20px; color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-link">→</a>
  <span class="wordmark">المفضلة</span>
  <span style="width:24px;"></span>
</header>

<div id="grid" class="grid"><div class="loading">جاري التحميل...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const FAV_KEY = "crystal_favorites";

  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } }
  function saveFavs(favs) { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

  function removeFav(id) {
    saveFavs(getFavs().filter(f => f !== id));
    load();
  }

  async function load() {
    const favs = getFavs();
    const grid = document.getElementById("grid");

    if (favs.length === 0) {
      grid.innerHTML = `<div class="empty">ما عندك منتجات مفضلة بعد.<br><br><a href="index.html">تصفحي المنتجات</a></div>`;
      return;
    }

    const { data: products, error } = await supabaseClient
      .from("products")
      .select(`id, name, price, sale_unit, product_images ( image_url, sort_order )`)
      .in("id", favs);

    if (error || !products) { grid.innerHTML = `<div class="empty">تعذر تحميل المفضلة</div>`; return; }

    grid.innerHTML = products.map(p => {
      const images = (p.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
      const img = images[0]?.image_url || "https://via.placeholder.com/300x300?text=No+Image";
      const unitLabel = p.sale_unit === "dozen" ? "دستة" : "قطعة";
      return `
        <a href="product.html?id=${p.id}" class="card">
          <button class="remove-btn" onclick="event.preventDefault(); removeFav('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
          <img src="${img}" alt="${p.name}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="price"><span class="en">${p.price}</span> د.ل / ${unitLabel}</div>
          </div>
        </a>
      `;
    }).join("");
  }

  load();
</script>

</body>
</html>
