<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسخة احتياطية | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;--success:#2E7D32;--error:#DC2626;
  --r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.site-header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: 'Tajawal'; font-weight: 800; font-size: 1.1rem; }
.back-link { color: #fff; text-decoration: none; font-size: 1.2rem; width: 24px; }
.container { padding: 18px; max-width: 460px; margin: 0 auto; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--sh-sm); text-align: center; }
.box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; line-height: 1.7; }
button {
  width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--r-md); font-weight: 700; font-family: 'Tajawal'; font-size: 0.9rem; cursor: pointer;
}
button:disabled { opacity: 0.6; }
.msg { margin-top: 12px; font-size: 0.82rem; font-weight: 700; }
.msg.ok { color: var(--success); }
.msg.err { color: var(--error); }
.note { background: #E1F1F2; color: #0E7C86; font-size: 0.78rem; padding: 10px; border-radius: var(--r-md); margin-top: 14px; text-align: right; }
</style>
</head>
<body>

<header class="site-header">
  <a href="admin.html" class="back-link">→</a>
  <span class="wordmark">نسخة احتياطية</span>
  <span style="width:24px;"></span>
</header>

<div class="container">
  <div class="box">
    <p>يحمّل هذا الزر نسخة كاملة من كل بيانات المتجر (المنتجات، الطلبات، الزبائن، المدن) كملف واحد على جهازك.</p>
    <button id="backupBtn" onclick="downloadBackup()">تنزيل نسخة احتياطية الآن</button>
    <div class="msg" id="msg"></div>
    <div class="note">احفظ الملف في مكان آمن (جوجل درايف مثلًا)، وكرر هذا كل أسبوع أو قبل أي تغيير كبير.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // حسابات الزبائن إيميلها وهمي على شكل 09XXXXXXXX@crystalstore.ly، وما عندهاش صلاحية الإدارة
  function isCustomerSession(session) {
    return /^0\d{9}@crystalstore\.ly$/i.test(session?.user?.email || "");
  }

  async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "admin-login.html"; return; }
    if (isCustomerSession(session)) { window.location.href = "index.html"; }
  }
  checkAuth();

  const TABLES = ["categories", "cities", "products", "product_images", "product_colors", "customers", "orders", "order_items", "order_status_history"];

  async function downloadBackup() {
    const btn = document.getElementById("backupBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    btn.textContent = "جاري التجميع...";
    msg.textContent = "";

    const backup = { generated_at: new Date().toISOString() };

    for (const table of TABLES) {
      const { data, error } = await supabaseClient.from(table).select("*");
      if (error) {
        msg.textContent = `خطأ في جدول ${table}: ` + error.message;
        msg.className = "msg err";
        btn.disabled = false;
        btn.textContent = "تنزيل نسخة احتياطية الآن";
        return;
      }
      backup[table] = data;
    }

    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().split("T")[0];
    a.href = url;
    a.download = `crystal-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    msg.textContent = "تم تنزيل النسخة بنجاح ✓";
    msg.className = "msg ok";
    btn.disabled = false;
    btn.textContent = "تنزيل نسخة احتياطية الآن";
  }
</script>

</body>
</html>
