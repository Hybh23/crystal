<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة منتج | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;--success:#2E7D32;--error:#DC2626;
  --r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.site-header { background: var(--primary); color: #fff; padding: 16px; text-align: center; }
.site-header .wordmark { font-family: 'Inter'; font-weight: 800; letter-spacing: 1.5px; font-size: 1.1rem; }
.site-header .page-title { font-size: 0.8rem; color: #F2E6C8; margin-top: 2px; }

.form-box {
  max-width: 420px; margin: 20px auto; background: var(--surface);
  border: 1px solid var(--border); padding: 22px; border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
}
label { display: block; margin: 12px 0 6px; font-size: 0.8rem; color: var(--muted); }
input, select {
  width: 100%; padding: 10px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: 0.88rem; font-family: 'Tajawal';
  background: var(--surface); color: var(--text);
}
input:focus, select:focus { outline: none; border-color: var(--primary); }
.hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.checkbox-row input { width: auto; }
.checkbox-row label { margin: 0; font-size: 0.85rem; color: var(--text); }
button {
  width: 100%; padding: 13px; margin-top: 18px; background: var(--primary);
  color: #fff; border: none; border-radius: var(--r-md); font-size: 0.92rem;
  font-weight: 700; font-family: 'Tajawal'; cursor: pointer;
}
button:disabled { opacity: 0.6; }
.msg { text-align: center; margin-top: 12px; font-size: 0.85rem; font-weight: 700; }
.msg.ok { color: var(--success); }
.msg.err { color: var(--error); }
.checking { text-align: center; padding: 50px 20px; color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wordmark">CRYSTAL</div>
  <div class="page-title">إضافة منتج جديد</div>
</header>

<div class="checking" id="checking">جاري التحقق من صلاحيتك...</div>

<div class="form-box" id="formBox" style="display:none;">
  <label>اسم المنتج</label>
  <input type="text" id="name" placeholder="مثلا: خاتم زاركون">

  <label>القسم</label>
  <select id="category"></select>

  <label>السعر (د.ل)</label>
  <input type="number" id="price" placeholder="60">

  <label>وحدة البيع</label>
  <select id="saleUnit">
    <option value="piece">قطعة</option>
    <option value="dozen">دستة</option>
  </select>

  <label>الألوان (اختياري)</label>
  <input type="text" id="colors" placeholder="ذهبي، فضي، أزرق">
  <div class="hint">افصلي بين كل لون وآخر بفاصلة. اتركيه فاضي لو المنتج بلا ألوان.</div>

  <label>صورة المنتج</label>
  <input type="file" id="imageFile" accept="image/*">

  <div class="checkbox-row">
    <input type="checkbox" id="isTrending">
    <label for="isTrending">إضافة هذا المنتج لقسم "ترند"</label>
  </div>

  <button id="saveBtn" onclick="saveProduct()">حفظ المنتج</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "admin-login.html";
      return;
    }

    const { data: categories } = await supabaseClient
      .from("categories")
      .select("id, name")
      .eq("active", true)
      .order("sort_order");

    const select = document.getElementById("category");
    select.innerHTML = (categories || []).map(c => `<option value="${c.id}">${c.name}</option>`).join("");

    document.getElementById("checking").style.display = "none";
    document.getElementById("formBox").style.display = "block";
  }
  init();

  async function saveProduct() {
    const name = document.getElementById("name").value.trim();
    const categoryId = document.getElementById("category").value;
    const price = parseFloat(document.getElementById("price").value);
    const saleUnit = document.getElementById("saleUnit").value;
    const colorsRaw = document.getElementById("colors").value.trim();
    const isTrending = document.getElementById("isTrending").checked;
    const file = document.getElementById("imageFile").files[0];
    const msg = document.getElementById("msg");
    const btn = document.getElementById("saveBtn");

    if (!name || !price || !file || !categoryId) {
      msg.textContent = "املي الاسم والقسم والسعر واختاري صورة";
      msg.className = "msg err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "جاري الحفظ...";
    msg.textContent = "";

    const { data: product, error: productError } = await supabaseClient
      .from("products")
      .insert({ name, price, sale_unit: saleUnit, active: true, category_id: categoryId, is_trending: isTrending })
      .select()
      .single();

    if (productError) {
      msg.textContent = "خطأ بالمنتج: " + productError.message;
      msg.className = "msg err";
      btn.disabled = false;
      btn.textContent = "حفظ المنتج";
      return;
    }

    const fileExt = file.name.split('.').pop();
    const filePath = `${product.id}-${Date.now()}.${fileExt}`;

    const { error: uploadError } = await supabaseClient.storage
      .from("product-images")
      .upload(filePath, file);

    if (uploadError) {
      msg.textContent = "تم حفظ المنتج لكن صار خطأ بالصورة: " + uploadError.message;
      msg.className = "msg err";
      btn.disabled = false;
      btn.textContent = "حفظ المنتج";
      return;
    }

    const { data: urlData } = supabaseClient.storage
      .from("product-images")
      .getPublicUrl(filePath);

    const { error: imageError } = await supabaseClient
      .from("product_images")
      .insert({ product_id: product.id, image_url: urlData.publicUrl, sort_order: 0 });

    if (imageError) {
      msg.textContent = "تم حفظ المنتج لكن صار خطأ بربط الصورة: " + imageError.message;
      msg.className = "msg err";
      btn.disabled = false;
      btn.textContent = "حفظ المنتج";
      return;
    }

    if (colorsRaw) {
      const colorNames = colorsRaw.split(/[,،]/).map(c => c.trim()).filter(c => c.length > 0);
      if (colorNames.length > 0) {
        const colorRows = colorNames.map(colorName => ({
          product_id: product.id, color_name: colorName, active: true
        }));
        const { error: colorsError } = await supabaseClient.from("product_colors").insert(colorRows);
        if (colorsError) {
          msg.textContent = "تم حفظ المنتج والصورة، لكن صار خطأ بالألوان: " + colorsError.message;
          msg.className = "msg err";
          btn.disabled = false;
          btn.textContent = "حفظ المنتج";
          return;
        }
      }
    }

    msg.textContent = "تم حفظ المنتج بنجاح!";
    msg.className = "msg ok";
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("colors").value = "";
    document.getElementById("isTrending").checked = false;
    document.getElementById("imageFile").value = "";
    btn.disabled = false;
    btn.textContent = "حفظ المنتج";
  }
</script>

</body>
</html>
