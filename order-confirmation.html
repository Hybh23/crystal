<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلبك | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;
  --success:#2E7D32;--warning:#0E7C86;
  --r-md:8px;--r-lg:12px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', Tahoma, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }
.box {
  background: var(--surface); border: 1px solid var(--border);
  padding: 32px 24px; border-radius: var(--r-lg); text-align: center;
  max-width: 360px; box-shadow: var(--sh-sm);
}
.check { font-size: 46px; margin-bottom: 10px; }
.wordmark { font-family: 'Inter'; font-weight: 800; color: var(--primary); letter-spacing: 1.5px; font-size: 1rem; margin-bottom: 14px; }
h2 { color: var(--text); margin-bottom: 14px; font-size: 1.2rem; }
.order-num { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 14px; font-family: 'Inter'; }
.row { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 8px; color: var(--muted); }
.note { font-size: 0.82rem; color: var(--warning); background: #E1F1F2; padding: 10px; border-radius: var(--r-md); margin-top: 14px; }
.back-link { display: block; margin-top: 18px; color: var(--primary); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<div class="box" id="box">جاري التحميل...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderNumber = params.get("order");
  const total = params.get("total");
  const method = params.get("method");

  const methodLabel = method === "bank_transfer" ? "تحويل مصرفي" : "الدفع عند الاستلام";
  const statusLabel = method === "bank_transfer" ? "بانتظار تأكيد الدفع" : "قيد التجهيز";

  document.getElementById("box").innerHTML = `
    <div class="wordmark">CRYSTAL</div>
    <div class="check">✅</div>
    <h2>تم استلام طلبك</h2>
    <div class="order-num">#${orderNumber || "—"}</div>
    <div class="row"><span>الإجمالي</span><span class="en">${total ? parseFloat(total).toFixed(2) + " د.ل" : "—"}</span></div>
    <div class="row"><span>طريقة الدفع</span><span>${methodLabel}</span></div>
    <div class="row"><span>حالة الطلب</span><span>${statusLabel}</span></div>
    ${method === "bank_transfer" ? `<div class="note">لا تنسى إرسال صورة إيصال التحويل مع رقم طلبك عبر واتساب لتأكيد الدفع.</div>` : ""}
    <a href="index.html" class="back-link">← رجوع للمنتجات</a>
  `;
</script>

</body>
</html>
