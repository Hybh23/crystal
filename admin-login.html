<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة | كرستال</title>
<link rel="apple-touch-icon" href="icon-admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كرستال - إدارة">
<meta name="theme-color" content="#A9822A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--error:#DC2626;--r-md:8px;--r-lg:12px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg);
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.box {
  background: var(--surface); border: 1px solid var(--border);
  padding: 32px; border-radius: var(--r-lg); width: 90%; max-width: 340px;
  box-shadow: var(--sh-sm); text-align: center;
}
.wordmark { font-family: 'Inter'; font-weight: 800; color: var(--primary); letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 4px; }
.subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
input {
  width: 100%; padding: 11px; margin-bottom: 12px;
  border: 1.5px solid var(--border); border-radius: var(--r-md); font-size: 0.88rem;
  font-family: 'Tajawal'; background: var(--bg); color: var(--text);
}
input:focus { outline: none; border-color: var(--primary); }
button {
  width: 100%; padding: 12px; background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-md); font-size: 0.92rem;
  font-weight: 700; font-family: 'Tajawal'; cursor: pointer;
}
button:disabled { opacity: 0.6; }
.msg { text-align: center; margin-top: 12px; font-size: 0.82rem; color: var(--error); font-weight: 700; }
</style>
</head>
<body>

<div class="box">
  <div class="wordmark">CRYSTAL</div>
  <div class="subtitle">دخول الإدارة</div>
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة السر">
  <button id="loginBtn" onclick="login()">دخول</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
      msg.textContent = "أدخل البريد وكلمة السر";
      return;
    }

    btn.disabled = true;
    btn.textContent = "جاري الدخول...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = "خطأ: " + error.message;
      btn.disabled = false;
      btn.textContent = "دخول";
      return;
    }

window.location.href = "admin.html";
  }
</script>

</body>
</html>
