<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--secondary:#B9975B;
  --n100:#F7F3E9;--n300:#E2D9C3;
  --success:#2E7D32;--warning:#0E7C86;--error:#DC2626;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }

.site-header { background: var(--primary); color: #fff; padding: 16px 20px; text-align: center; }
.site-header .wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 1.5px; }
.site-header .page-title { font-size: 0.8rem; color: #F2E6C8; margin-top: 2px; }

.container { padding: 14px; max-width: 480px; margin: 0 auto; }
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--sh-sm);
}
label { display: block; font-size: 0.78rem; color: var(--muted); margin: 10px 0 5px; }
input, select, textarea {
  width: 100%; padding: 10px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: 0.88rem; font-family: 'Tajawal';
  background: var(--surface); color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
textarea { resize: vertical; min-height: 50px; }

.pay-option {
  display: flex; align-items: center; gap: 8px; padding: 11px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  margin-top: 8px; cursor: pointer; font-size: 0.9rem;
}
.pay-option input { width: auto; }
.bank-details {
  background: var(--n100); border-radius: var(--r-md);
  padding: 14px; margin-top: 10px; font-size: 0.85rem; display: none;
}
.bank-details div { margin-bottom: 5px; }
.bank-details b { color: var(--primary); }

.summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 7px; }
.summary-row.total {
  font-weight: 800; font-size: 1.05rem; color: var(--primary);
  border-top: 1px solid var(--border); padding-top: 10px;
}
.submit-btn {
  width: 100%; padding: 14px; background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-md); font-size: 0.95rem;
  font-weight: 700; font-family: 'Tajawal'; margin-top: 12px; cursor: pointer;
}
.submit-btn:disabled { opacity: 0.6; }
.err { color: var(--error); font-size: 0.82rem; text-align: center; margin-top: 10px; font-weight: 700; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wordmark en">CRYSTAL</div>
  <div class="page-title">إتمام الطلب</div>
</header>

<div class="container" id="container">جاري التحميل...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const CART_KEY = "crystal_cart";

  const BANK_NAME = "مصرف الصحاري";
  const BANK_ACCOUNT_HOLDER = "محمد ابراهيم محمد زيدان";
  const BANK_ACCOUNT_NUMBER = "2009392184 / IBAN: LY44006009000002009392184";

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }

  let cities = [];
  let subtotal = 0;

  async function init() {
    const cart = getCart();
    subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    if (cart.length === 0 || subtotal < 300) {
      window.location.href = "cart.html";
      return;
    }

    const { data } = await supabaseClient
      .from("cities")
      .select("id, name, shipping_price")
      .eq("active", true)
      .order("name");

    cities = data || [];
    render();
  }

  function render() {
    const cityOptions = cities.map(c => `<option value="${c.id}" data-price="${c.shipping_price}">${c.name} (توصيل ${c.shipping_price} د.ل)</option>`).join("");

    document.getElementById("container").innerHTML = `
      <div class="box">
        <label>الاسم الكامل *</label>
        <input type="text" id="name">
        <label>رقم الهاتف *</label>
        <input type="tel" id="phone">
        <label>رقم هاتف ثانٍ (اختياري)</label>
        <input type="tel" id="secondPhone">
        <label>اسم المحل (اختياري)</label>
        <input type="text" id="shopName">
        <label>المدينة *</label>
        <select id="city" onchange="updateTotal()">
          <option value="">اختاري المدينة</option>
          ${cityOptions}
        </select>
        <label>المنطقة *</label>
        <input type="text" id="area">
        <label>تفاصيل العنوان (اختياري)</label>
        <input type="text" id="addressDetails">
        <label>ملاحظات (اختياري)</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="box">
        <label style="margin-top:0;">طريقة الدفع *</label>
        <label class="pay-option">
          <input type="radio" name="payMethod" value="cod" checked onchange="togglePayment()">
          الدفع عند الاستلام
        </label>
        <label class="pay-option">
          <input type="radio" name="payMethod" value="bank_transfer" onchange="togglePayment()">
          تحويل مصرفي
        </label>
        <div class="bank-details" id="bankDetails">
          <div><b>المصرف:</b> ${BANK_NAME}</div>
          <div><b>اسم الحساب:</b> ${BANK_ACCOUNT_HOLDER}</div>
          <div><b>رقم الحساب:</b> ${BANK_ACCOUNT_NUMBER}</div>
          <div style="margin-top:8px;">بعد التحويل، أرسلي صورة الإيصال مع رقم طلبك عبر واتساب لتأكيد الدفع.</div>
        </div>
      </div>

      <div class="box">
        <div class="summary-row"><span>إجمالي المنتجات</span><span class="en">${subtotal.toFixed(2)} د.ل</span></div>
        <div class="summary-row"><span>التوصيل</span><span class="en" id="shippingDisplay">—</span></div>
        <div class="summary-row total"><span>الإجمالي</span><span class="en" id="grandTotalDisplay">—</span></div>
        <button class="submit-btn" id="submitBtn" onclick="submitOrder()">تأكيد الطلب</button>
        <div class="err" id="errMsg"></div>
      </div>
    `;
  }

  function togglePayment() {
    const method = document.querySelector('input[name="payMethod"]:checked').value;
    document.getElementById("bankDetails").style.display = method === "bank_transfer" ? "block" : "none";
  }

  function updateTotal() {
    const citySelect = document.getElementById("city");
    const selected = citySelect.options[citySelect.selectedIndex];
    const shipping = selected && selected.dataset.price ? parseFloat(selected.dataset.price) : 0;
    document.getElementById("shippingDisplay").textContent = selected.value ? shipping.toFixed(2) + " د.ل" : "—";
    document.getElementById("grandTotalDisplay").textContent = selected.value ? (subtotal + shipping).toFixed(2) + " د.ل" : "—";
  }

  async function submitOrder() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const secondPhone = document.getElementById("secondPhone").value.trim();
    const shopName = document.getElementById("shopName").value.trim();
    const cityId = document.getElementById("city").value;
    const area = document.getElementById("area").value.trim();
    const addressDetails = document.getElementById("addressDetails").value.trim();
    const notes = document.getElementById("notes").value.trim();
    const paymentMethod = document.querySelector('input[name="payMethod"]:checked').value;
    const errMsg = document.getElementById("errMsg");
    const btn = document.getElementById("submitBtn");

    if (!name || !phone || !cityId || !area) {
      errMsg.textContent = "املي الاسم والهاتف والمدينة والمنطقة";
      return;
    }

    const cart = getCart();
    const items = cart.map(item => ({
      product_id: item.product_id,
      product_name: item.name,
      color_name: item.color,
      sale_unit: item.sale_unit,
      quantity: item.quantity,
      unit_price: item.price
    }));

    btn.disabled = true;
    btn.textContent = "جاري إرسال الطلب...";
    errMsg.textContent = "";

    const { data, error } = await supabaseClient.rpc("create_guest_order", {
      p_customer_name: name,
      p_customer_phone: phone,
      p_customer_second_phone: secondPhone || null,
      p_shop_name: shopName || null,
      p_city_id: cityId,
      p_area: area,
      p_address_details: addressDetails || null,
      p_notes: notes || null,
      p_payment_method: paymentMethod,
      p_items: items
    });

    if (error) {
      errMsg.textContent = "خطأ: " + error.message;
      btn.disabled = false;
      btn.textContent = "تأكيد الطلب";
      return;
    }

    const result = data[0];
    localStorage.removeItem(CART_KEY);
    window.location.href = `order-confirmation.html?order=${encodeURIComponent(result.result_order_number)}&total=${result.result_grand_total}&method=${paymentMethod}`;
  }

  init();
</script>

</body>
</html>
