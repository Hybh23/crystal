<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "c8318950-edb6-4899-bc3b-19189079f1d0" });

    const refreshStatus = () => {
      const status = document.getElementById("notifStatus");
      const btn = document.getElementById("notifBtn");
      if (OneSignal.Notifications.permission) {
        status.textContent = "التنبيهات مفعّلة ✓";
        status.className = "notif-status on";
        btn.style.display = "none";
      } else {
        status.textContent = "";
        btn.style.display = "inline-block";
      }
    };

    OneSignal.Notifications.addEventListener("permissionChange", refreshStatus);
    refreshStatus();

    window._enableNotif = async () => {
      await OneSignal.Notifications.requestPermission();
      refreshStatus();
    };
  });

  function enableNotifications() {
    if (window._enableNotif) window._enableNotif();
  }

  async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "admin-login.html";
      return;
    }
    document.getElementById("checking").style.display = "none";
    document.getElementById("pageContent").style.display = "block";
  }
  checkAuth();

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "admin-login.html";
  }
</script>
