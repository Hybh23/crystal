<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--secondary:#B9975B;
  --n100:#F7F3E9;--n300:#E2D9C3;
  --success:#2E7D32;--warning:#0E7C86;--error:#DC2626;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }

.site-header {
  background: var(--primary); color: #fff; padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
}
.site-header .wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 1.5px; }
.site-header a.back { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.9; }

.container { padding: 16px; max-width: 500px; margin: 0 auto; }
.item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; box-shadow: var(--sh-sm);
}
.item img { width: 70px; height: 70px; border-radius: var(--r-md); object-fit: cover; background: var(--n100); }
.item-info { flex: 1; }
.item-info h3 { font-size: 0.95rem; margin-bottom: 4px; font-weight: 700; }
.item-info .meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
.qty-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.qty-stepper { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.qty-stepper button {
  width: 32px; height: 32px; background: var(--n100); border: none;
  font-size: 1rem; font-family: 'Inter'; color: var(--primary); cursor: pointer;
}
.qty-stepper input {
  width: 42px; text-align: center; border: none; font-family: 'Inter'; font-size: 0.85rem; padding: 6px 0;
}
.qty-stepper input::-webkit-outer-spin-button, .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.line-total { font-weight: 800; color: var(--primary); font-size: 0.9rem; font-family: 'Inter'; }
.remove-btn { background: none; border: none; color: var(--error); font-size: 0.78rem; cursor: pointer; margin-top: 6px; font-family: 'Tajawal'; }

.summary {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 18px; margin-top: 18px; box-shadow: var(--sh-sm);
}
.summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
.summary-row.total {
  font-weight: 800; font-size: 1.05rem; color: var(--primary);
  border-top: 1px solid var(--border); padding-top: 10px;
}
.min-warning {
  background: #E1F1F2; color: var(--warning); padding: 10px 12px;
  border-radius: var(--r-md); font-size: 0.82rem; margin-top: 12px; text-align: center; font-weight: 700;
}
.checkout-btn {
  display: block; width: 100%; padding: 13px; margin-top: 14px;
  background: var(--primary); color: #fff; border: none; border-radius: var(--r-md);
  font-size: 0.95rem; font-weight: 700; font-family: 'Tajawal';
  text-align: center; text-decoration: none; cursor: pointer;
}
.checkout-btn.disabled { background: var(--n300); color: var(--surface); pointer-events: none; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty a { color: var(--primary); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<header class="site-header">
  <span class="wordmark en">CRYSTAL</span>
  <a href="index.html" class="back">← رجوع للمنتجات</a>
</header>

<div class="container" id="container"></div>

<script>
  const CART_KEY = "crystal_cart";
  const MIN_ORDER = 300;

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    render();
  }

  function removeItem(indexToRemove) {
    let cart = getCart();
    cart.splice(indexToRemove, 1);
    saveCart(cart);
  }

  function updateQty(index, value) {
    const qty = parseInt(value);
    let cart = getCart();
    if (qty && qty > 0) {
      cart[index].quantity = qty;
    }
    saveCart(cart);
  }

  function stepQty(index, delta) {
    const cart = getCart();
    let newQty = cart[index].quantity + delta;
    if (newQty < 1) newQty = 1;
    updateQty(index, newQty);
  }

  function render() {
    const cart = getCart();
    const container = document.getElementById("container");

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty">
          السلة فاضية حاليًا.<br><br>
          <a href="index.html">تصفحي المنتجات</a>
        </div>
      `;
      return;
    }

    let subtotal = 0;

    const itemsHtml = cart.map((item, index) => {
      const lineTotal = item.price * item.quantity;
      subtotal += lineTotal;
      const unitLabel = item.sale_unit === "dozen" ? "دستة" : "قطعة";

      return `
        <div class="item">
          <img src="${item.image}" alt="${item.name}">
          <div class="item-info">
            <h3>${item.name}</h3>
            <div class="meta">${item.color ? "اللون: " + item.color + " — " : ""}<span class="en">${item.price}</span> د.ل / ${unitLabel}</div>
            <div class="qty-row">
              <div class="qty-stepper">
                <button type="button" onclick="stepQty(${index}, -1)">−</button>
                <input type="number" min="1" value="${item.quantity}" id="qty-${index}" onchange="updateQty(${index}, this.value)">
                <button type="button" onclick="stepQty(${index}, 1)">+</button>
              </div>
              <span class="line-total en">${lineTotal.toFixed(2)} د.ل</span>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">حذف</button>
          </div>
        </div>
      `;
    }).join("");

    const belowMin = subtotal < MIN_ORDER;
    const remaining = (MIN_ORDER - subtotal).toFixed(2);

    container.innerHTML = itemsHtml + `
      <div class="summary">
        <div class="summary-row total">
          <span>إجمالي المنتجات</span>
          <span class="en">${subtotal.toFixed(2)} د.ل</span>
        </div>
        ${belowMin ? `<div class="min-warning">أضيفي ${remaining} د.ل أخرى من المنتجات لإكمال الحد الأدنى للطلب (300 د.ل).</div>` : ""}
        <a href="checkout.html" class="checkout-btn ${belowMin ? 'disabled' : ''}">
          ${belowMin ? "أكملي الحد الأدنى أول" : "متابعة الطلب"}
        </a>
      </div>
    `;
  }

  render();
</script>

</body>
</html>
