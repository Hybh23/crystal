<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;--success:#2E7D32;--warning:#0E7C86;
  --r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }
.site-header {
  background: var(--primary); color: #fff; padding: 14px 18px;
  display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100;
}
.site-header .wordmark { font-family: 'Inter'; font-weight: 800; letter-spacing: 1.5px; font-size: 1.1rem; }
.back-link { color: #fff; text-decoration: none; font-size: 1.2rem; }

.container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
.main-img { width: 100%; height: 300px; object-fit: cover; background: var(--n100); }
.content { padding: 16px; }
.tags { display: flex; gap: 6px; margin-bottom: 8px; }
.tag { font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.tag.trend { background: var(--n100); color: var(--primary); }
.tag.low { background: #E1F1F2; color: var(--warning); }
h1 { font-size: 1.15rem; margin-bottom: 6px; }
.price-line { color: var(--primary); font-weight: 800; font-size: 1.3rem; margin-bottom: 14px; }
.price-line .unit { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
.description { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }

.box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 16px; box-shadow: var(--sh-sm); margin-bottom: 14px;
}
.field { margin-bottom: 14px; }
.field label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 6px; }
.field select, .field input {
  width: 100%; padding: 10px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: 0.9rem; font-family: 'Tajawal';
}
.add-btn {
  width: 100%; padding: 14px; background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-md); font-size: 0.95rem; font-weight: 700;
  font-family: 'Tajawal'; cursor: pointer;
}
.added-msg { text-align: center; margin-top: 10px; color: var(--success); font-weight: 700; font-size: 0.85rem; display: none; }
.loading { text-align: center; padding: 80px 20px; color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-link">→</a>
  <span class="wordmark">CRYSTAL</span>
</header>

<div id="content" class="loading">جاري التحميل...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const CART_KEY = "crystal_cart";

  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");

  let currentProduct = null;

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  async function load() {
    if (!productId) { window.location.href = "index.html"; return; }

    const { data: p, error } = await supabaseClient
      .from("products")
      .select(`
        id, name, price, sale_unit, description, is_trending, low_stock,
        categories ( name ),
        product_images ( image_url, sort_order ),
        product_colors ( color_name, active )
      `)
      .eq("id", productId)
      .single();

    if (error || !p) {
      document.getElementById("content").innerHTML = `<div class="loading">تعذر إيجاد هذا المنتج</div>`;
      return;
    }

    currentProduct = p;
    const images = (p.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
    const img = images[0]?.image_url || "https://via.placeholder.com/400x400?text=No+Image";
    const unitLabel = p.sale_unit === "dozen" ? "دستة" : "قطعة";
    const activeColors = (p.product_colors || []).filter(c => c.active);
    const hasColors = activeColors.length > 0;

    const colorOptions = hasColors
      ? `<option value="">اختاري لون</option>` + activeColors.map(c => `<option value="${c.color_name}">${c.color_name}</option>`).join("")
      : "";

    document.getElementById("content").innerHTML = `
      <div class="container">
        <img src="${img}" class="main-img" alt="${p.name}">
        <div class="content">
          <div class="tags">
            ${p.categories ? `<span class="tag trend">${p.categories.name}</span>` : ""}
            ${p.is_trending ? `<span class="tag trend">ترند</span>` : ""}
            ${p.low_stock ? `<span class="tag low">آخر القطع</span>` : ""}
          </div>
          <h1>${p.name}</h1>
          <div class="price-line"><span class="en">${p.price}</span> د.ل <span class="unit">/ ${unitLabel}</span></div>
          ${p.description ? `<div class="description">${p.description}</div>` : ""}

          <div class="box">
            ${hasColors ? `
            <div class="field">
              <label>اللون</label>
              <select id="colorSelect">${colorOptions}</select>
            </div>` : ""}
            <div class="field">
              <label>الكمية (بال${unitLabel})</label>
              <input type="number" id="qtyInput" value="1" min="1">
            </div>
            <button class="add-btn" onclick="addToCart()">أضف للسلة</button>
            <div class="added-msg" id="addedMsg">تمت الإضافة للسلة ✓</div>
          </div>
        </div>
      </div>
    `;
  }

  function addToCart() {
    const qty = parseInt(document.getElementById("qtyInput").value);
    if (!qty || qty < 1) { alert("حددي كمية صحيحة"); return; }

    let colorName = null;
    const colorSelect = document.getElementById("colorSelect");
    if (colorSelect) {
      colorName = colorSelect.value;
      if (!colorName) { alert("لازم تختاري لون أول"); return; }
    }

    const images = (currentProduct.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
    const img = images[0]?.image_url || "https://via.placeholder.com/300x300?text=No+Image";

    const cart = getCart();
    const existing = cart.find(item => item.product_id === currentProduct.id && item.color === (colorName || null));

    if (existing) {
      existing.quantity += qty;
    } else {
      cart.push({
        product_id: currentProduct.id,
        name: currentProduct.name,
        price: currentProduct.price,
        sale_unit: currentProduct.sale_unit,
        color: colorName || null,
        quantity: qty,
        image: img
      });
    }

    saveCart(cart);
    const msg = document.getElementById("addedMsg");
    msg.style.display = "block";
    setTimeout(() => { msg.style.display = "none"; }, 1800);
  }

  load();
</script>

</body>
</html>
