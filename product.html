<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | كرستال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--n100:#F7F3E9;--success:#2E7D32;--warning:#0E7C86;
  --r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }
.site-header {
  background: var(--primary); color: #fff; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.site-header .wordmark { font-family: 'Inter'; font-weight: 800; letter-spacing: 1.5px; font-size: 1.1rem; }
.back-link { color: #fff; text-decoration: none; font-size: 1.2rem; width: 24px; }
.cart-badge {
  display: flex; align-items: center; gap: 6px;
  background: #fff; color: var(--primary); padding: 5px 11px;
  border-radius: 999px; font-size: 0.78rem; font-weight: 700; text-decoration: none;
}
.cart-icon { width: 15px; height: 15px; }

.container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
.main-img { width: 100%; height: 300px; object-fit: cover; background: var(--n100); display: block; }
.thumb-row { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; }
.thumb-row img {
  width: 56px; height: 56px; object-fit: cover; border-radius: var(--r-md);
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
}
.thumb-row img.active { border-color: var(--primary); }

.content { padding: 16px; }
.tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.tag { font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.tag.trend { background: var(--n100); color: var(--primary); }
.tag.low { background: #E1F1F2; color: var(--warning); }
h1 { font-size: 1.15rem; margin-bottom: 6px; }
.price-line { color: var(--primary); font-weight: 800; font-size: 1.3rem; margin-bottom: 14px; }
.price-line .unit { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
.description { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }

.box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 16px; box-shadow: var(--sh-sm); margin-bottom: 14px;
}
.field { margin-bottom: 14px; }
.field label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 6px; }
.field select {
  width: 100%; padding: 10px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: 0.9rem; font-family: 'Tajawal';
}

.qty-stepper { display: flex; align-items: center; width: fit-content; border: 1.5px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.qty-stepper button {
  width: 40px; height: 40px; background: var(--n100); border: none;
  font-size: 1.2rem; font-family: 'Inter'; color: var(--primary); cursor: pointer;
}
.qty-stepper input {
  width: 50px; text-align: center; border: none; border-radius: 0;
  font-family: 'Inter'; font-size: 0.95rem; padding: 10px 0;
}
.qty-stepper input::-webkit-outer-spin-button, .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.add-btn {
  width: 100%; padding: 14px; background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-md); font-size: 0.95rem; font-weight: 700;
  font-family: 'Tajawal'; cursor: pointer;
}
.added-msg { text-align: center; margin-top: 10px; color: var(--success); font-weight: 700; font-size: 0.85rem; display: none; }
.loading { text-align: center; padding: 80px 20px; color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-link">→</a>
  <span class="wordmark">CRYSTAL</span>
  <a href="cart.html" class="cart-badge" id="cartBadge">
    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
      <path d="M3 4h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6"/>
    </svg>
    <span id="cartCount">0</span>
  </a>
</header>

<div id="content" class="loading">جاري التحميل...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // تنظيف أي قيمة قبل حقنها في HTML (حماية من XSS)
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const CART_KEY = "crystal_cart";

  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");

  let currentProduct = null;
  let currentImages = [];

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function updateCartBadge() {
    const cart = getCart();
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").textContent = totalItems;
  }

  async function load() {
    updateCartBadge();

    if (!productId) { window.location.href = "index.html"; return; }

    const { data: p, error } = await supabaseClient
      .from("products")
      .select(`
        id, name, price, sale_unit, description, is_trending, low_stock,
        categories ( name ),
        product_images ( image_url, sort_order ),
        product_colors ( color_name, active )
      `)
      .eq("id", productId)
      .single();

    if (error || !p) {
      document.getElementById("content").innerHTML = `<div class="loading">تعذر إيجاد هذا المنتج</div>`;
      return;
    }

    currentProduct = p;
    currentImages = (p.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
    if (currentImages.length === 0) {
      currentImages = [{ image_url: "https://via.placeholder.com/400x400?text=No+Image" }];
    }

    const unitLabel = p.sale_unit === "dozen" ? "دستة" : "قطعة";
    const activeColors = (p.product_colors || []).filter(c => c.active);
    const hasColors = activeColors.length > 0;

    const colorOptions = hasColors
      ? `<option value="">اختاري لون</option>` + activeColors.map(c => `<option value="${esc(c.color_name)}">${esc(c.color_name)}</option>`).join("")
      : "";

    const thumbsHtml = currentImages.length > 1
      ? `<div class="thumb-row" id="thumbRow">${currentImages.map((img, i) =>
          `<img src="${esc(img.image_url)}" class="${i === 0 ? 'active' : ''}" onclick="setMainImage(${i})">`
        ).join("")}</div>`
      : "";

    document.getElementById("content").innerHTML = `
      <div class="container">
        <img src="${esc(currentImages[0].image_url)}" class="main-img" id="mainImg" alt="${esc(p.name)}">
        ${thumbsHtml}
        <div class="content">
          <div class="tags">
            ${p.categories ? `<span class="tag trend">${esc(p.categories.name)}</span>` : ""}
            ${p.is_trending ? `<span class="tag trend">ترند</span>` : ""}
            ${p.low_stock ? `<span class="tag low">آخر القطع</span>` : ""}
          </div>
          <h1>${esc(p.name)}</h1>
          <div class="price-line"><span class="en">${esc(p.price)}</span> د.ل <span class="unit">/ ${unitLabel}</span></div>
          ${p.description ? `<div class="description">${esc(p.description)}</div>` : ""}

          <div class="box">
            ${hasColors ? `
            <div class="field">
              <label>اللون</label>
              <select id="colorSelect">${colorOptions}</select>
            </div>` : ""}
            <div class="field">
              <label>الكمية (بال${unitLabel})</label>
              <div class="qty-stepper">
                <button type="button" onclick="changeQty(-1)">−</button>
                <input type="number" id="qtyInput" value="1" min="1">
                <button type="button" onclick="changeQty(1)">+</button>
              </div>
            </div>
            <button class="add-btn" onclick="addToCart()">أضف للسلة</button>
            <div class="added-msg" id="addedMsg">تمت الإضافة للسلة ✓</div>
          </div>
        </div>
      </div>
    `;
  }

  function setMainImage(index) {
    document.getElementById("mainImg").src = currentImages[index].image_url;
    document.querySelectorAll("#thumbRow img").forEach((img, i) => {
      img.classList.toggle("active", i === index);
    });
  }

  function changeQty(delta) {
    const input = document.getElementById("qtyInput");
    let val = parseInt(input.value) || 1;
    val = Math.max(1, val + delta);
    input.value = val;
  }

  function addToCart() {
    const qty = parseInt(document.getElementById("qtyInput").value);
    if (!qty || qty < 1) { alert("حددي كمية صحيحة"); return; }

    let colorName = null;
    const colorSelect = document.getElementById("colorSelect");
    if (colorSelect) {
      colorName = colorSelect.value;
      if (!colorName) { alert("لازم تختاري لون أول"); return; }
    }

    const cart = getCart();
    const existing = cart.find(item => item.product_id === currentProduct.id && item.color === (colorName || null));

    if (existing) {
      existing.quantity += qty;
    } else {
      cart.push({
        product_id: currentProduct.id,
        name: currentProduct.name,
        price: currentProduct.price,
        sale_unit: currentProduct.sale_unit,
        color: colorName || null,
        quantity: qty,
        image: currentImages[0].image_url
      });
    }

    saveCart(cart);
    updateCartBadge();
    const msg = document.getElementById("addedMsg");
    msg.style.display = "block";
    setTimeout(() => { msg.style.display = "none"; }, 1800);
  }

  load();
</script>

</body>
</html>
