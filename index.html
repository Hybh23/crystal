<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كرستال | المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--secondary:#B9975B;--n100:#F7F3E9;--n300:#E2D9C3;
  --success:#2E7D32;--warning:#0E7C86;--error:#DC2626;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }

.sticky-top { position: sticky; top: 0; z-index: 100; }

.site-header {
  background: var(--primary); color: #fff;
  padding: 16px 18px 32px;
  clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%);
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 24px; height: 24px; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; }
.brand-ar { font-family: 'Tajawal'; font-weight: 700; font-size: 0.82rem; color: #F2E6C8; margin-top: 1px; }
.tagline { text-align: center; font-size: 0.7rem; color: #F2E6C8; margin-top: 10px; }

.cart-badge {
  display: flex; align-items: center; gap: 6px;
  background: #fff; color: var(--primary); padding: 6px 12px;
  border-radius: 999px; font-size: 0.82rem; font-weight: 700; text-decoration: none;
}
.cart-icon { width: 17px; height: 17px; }

.category-bar {
  display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  -ms-overflow-style: none; scrollbar-width: none;
}
.category-bar::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 15px; border-radius: 999px; font-size: 0.78rem;
  font-family: 'Tajawal'; background: var(--n100); color: var(--muted);
  border: none; cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--primary); color: #fff; font-weight: 700; }

.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; padding: 14px;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  overflow: hidden; box-shadow: var(--sh-sm); display: flex; flex-direction: column;
  text-decoration: none; color: var(--text); position: relative;
}
.card img { width: 100%; height: 130px; object-fit: cover; background: var(--n100); }
.trend-tag {
  position: absolute; top: 8px; right: 8px; background: var(--primary); color: #fff;
  font-size: 0.65rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
}
.low-tag {
  position: absolute; top: 8px; left: 8px; background: var(--warning); color: #fff;
  font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
}
.card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
.card-body h3 { font-size: 0.88rem; margin-bottom: 4px; font-weight: 700; }
.price { color: var(--primary); font-weight: 800; font-size: 0.92rem; margin-top: auto; }
.unit { color: var(--muted); font-size: 0.72rem; }
.loading, .empty { text-align: center; padding: 50px 20px; color: var(--muted); grid-column: 1/-1; }
</style>
</head>
<body>

<div class="sticky-top">
  <header class="site-header">
    <div class="header-top">
      <div class="brand">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12l3 5-9 13L3 8z"/>
          <path d="M3 8h18"/>
          <path d="M9 3l-2 5 5 13 5-13-2-5"/>
        </svg>
        <div class="brand-text">
          <span class="wordmark en">CRYSTAL</span>
          <span class="brand-ar">كرستال</span>
        </div>
      </div>
      <a href="cart.html" class="cart-badge" id="cartBadge">
        <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
          <path d="M3 4h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6"/>
        </svg>
        <span id="cartCount">0</span>
      </a>
    </div>
    <div class="tagline">اكسسوارات بالجملة والقطعة</div>
  </header>
  <div class="category-bar" id="categoryBar"></div>
</div>

<div id="productsGrid" class="grid">
  <div class="loading">جاري تحميل المنتجات...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "crystal_cart";
  let allProducts = [];
  let currentFilter = "all";

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }

  function updateCartBadge() {
    const cart = getCart();
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").textContent = totalItems;
  }

  async function init() {
    updateCartBadge();

    const { data: categories } = await supabaseClient
      .from("categories")
      .select("id, name")
      .eq("active", true)
      .order("sort_order");

    const { data: products, error } = await supabaseClient
      .from("products")
      .select(`
        id, name, price, sale_unit, is_trending, low_stock, category_id,
        product_images ( image_url, sort_order )
      `)
      .eq("active", true)
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("productsGrid").innerHTML = `<div class="empty">صار خطأ: ${error.message}</div>`;
      return;
    }

    allProducts = products || [];
    renderChips(categories || []);
    renderGrid();
  }

  function renderChips(categories) {
    const bar = document.getElementById("categoryBar");
    const chips = [
      { key: "all", label: "الكل" },
      { key: "trending", label: "ترند" },
      ...categories.map(c => ({ key: c.id, label: c.name }))
    ];

    bar.innerHTML = chips.map(c =>
      `<button class="chip ${c.key === currentFilter ? 'active' : ''}" onclick="setFilter('${c.key}', this)">${c.label}</button>`
    ).join("");
  }

  function setFilter(key, el) {
    currentFilter = key;
    document.querySelectorAll(".chip").forEach(chip => chip.classList.remove("active"));
    el.classList.add("active");
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById("productsGrid");

    let filtered;
    if (currentFilter === "all") filtered = allProducts;
    else if (currentFilter === "trending") filtered = allProducts.filter(p => p.is_trending);
    else filtered = allProducts.filter(p => p.category_id === currentFilter);

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty">لا توجد منتجات في هذا القسم حاليًا</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const images = (p.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
      const img = images[0]?.image_url || "https://via.placeholder.com/300x300?text=No+Image";
      const unitLabel = p.sale_unit === "dozen" ? "دستة" : "قطعة";

      return `
        <a href="product.html?id=${p.id}" class="card">
          ${p.is_trending ? `<span class="trend-tag">ترند</span>` : ""}
          ${p.low_stock ? `<span class="low-tag">آخر القطع</span>` : ""}
          <img src="${img}" alt="${p.name}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="price"><span class="en">${p.price}</span> د.ل <span class="unit">/ ${unitLabel}</span></div>
          </div>
        </a>
      `;
    }).join("");
  }

  init();
</script>

</body>
</html>
