<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كرستال | المنتجات</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كرستال">
<meta name="theme-color" content="#A9822A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--secondary:#B9975B;--n100:#F7F3E9;--n300:#E2D9C3;
  --success:#2E7D32;--warning:#0E7C86;--error:#DC2626;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }

.sticky-top { position: sticky; top: 0; z-index: 100; background: var(--primary); }

.site-header {
  background: var(--primary); color: #fff;
  padding: 18px 18px 36px;
  clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%);
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 44px; height: 44px; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: 2.5px; }
.brand-ar { font-family: 'Tajawal'; font-weight: 700; font-size: 1.1rem; color: #F2E6C8; margin-top: 2px; }
.slogan { text-align: center; font-size: 1rem; font-weight: 800; color: #fff; margin-top: 14px; }
.tagline { text-align: center; font-size: 0.72rem; color: #F2E6C8; margin-top: 4px; }
.search-bar { background: var(--surface); padding: 10px 14px 0; }
.search-bar input {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 0.85rem; font-family: 'Tajawal'; background: var(--n100);
}
.search-bar input:focus { outline: none; border-color: var(--primary); background: var(--surface); }
.icon-group { display: flex; align-items: center; gap: 12px; }
.icon-btn { position: relative; color: #fff; background: none; border: none; cursor: pointer; padding: 0; text-decoration: none; }
.icon-btn svg { width: 22px; height: 22px; display: block; }
