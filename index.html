<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كرستال | المنتجات</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كرستال">
<meta name="theme-color" content="#A9822A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;--surface:#ffffff;--text:#241F17;--muted:#79705F;--border:#E7E0D0;
  --primary:#A9822A;--secondary:#B9975B;--n100:#F7F3E9;--n300:#E2D9C3;
  --success:#2E7D32;--warning:#0E7C86;--error:#DC2626;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
  --sh-md:0 4px 14px rgba(36,31,23,.08);
  --nav-h:64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', Tahoma, sans-serif; background: var(--bg); color: var(--text); padding-bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom)); }
.en { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; }
.wrap { max-width: 1100px; margin: 0 auto; }

/* ===== الهيدر ===== */
.site-header {
  background: var(--primary); color: #fff;
  padding: 18px 18px 34px;
  clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%);
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: clamp(6px, 2vw, 10px); min-width: 0; }
.logo-icon { width: clamp(30px, 8vw, 44px); height: clamp(30px, 8vw, 44px); flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: clamp(1.25rem, 5.5vw, 2rem); letter-spacing: clamp(1px, 0.5vw, 2.5px); white-space: nowrap; }
.brand-ar { font-family: 'Tajawal'; font-weight: 700; font-size: clamp(0.75rem, 3vw, 1.1rem); color: #F2E6C8; margin-top: 2px; white-space: nowrap; }
.slogan { text-align: center; font-size: 1.05rem; font-weight: 800; color: #fff; margin-top: 14px; }
.tagline { text-align: center; font-size: 0.75rem; color: #F2E6C8; margin-top: 4px; }

.icon-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  position: relative; color: #fff; background: rgba(255,255,255,0.14); border: none; cursor: pointer;
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  text-decoration: none;
}
.icon-btn svg { width: 20px; height: 20px; display: block; }
.icon-btn.active-bell svg { fill: #fff; }
.count-dot {
  position: absolute; top: -3px; left: -3px; background: #fff; color: var(--primary);
  font-size: 0.6rem; font-weight: 800; border-radius: 999px; min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px; font-family: 'Inter';
}

/* ===== شريط المعلومات ===== */
.perks { display: flex; gap: 8px; padding: 2px 14px 4px; overflow-x: auto; scrollbar-width: none; }
.perks::-webkit-scrollbar { display: none; }
.perk {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.74rem; color: var(--muted);
}
.perk b { color: var(--text); font-weight: 700; }
.perk svg { width: 14px; height: 14px; stroke: var(--primary); flex-shrink: 0; }

/* ===== البحث والأقسام (ثابتين فوق وقت السكرول) ===== */
.sticky-tools { position: sticky; top: 0; z-index: 100; background: var(--bg); padding-top: 10px; }
.search-bar { padding: 0 14px; position: relative; }
.search-bar svg { position: absolute; top: 50%; right: 28px; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); pointer-events: none; }
.search-bar input {
  width: 100%; padding: 11px 42px 11px 14px; border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 0.88rem; font-family: 'Tajawal'; background: var(--surface); color: var(--text);
}
.search-bar input:focus { outline: none; border-color: var(--primary); }
.category-bar {
  display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px;
  border-bottom: 1px solid var(--border); scrollbar-width: none;
}
.category-bar::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 16px; border-radius: 999px; font-size: 0.8rem;
  font-family: 'Tajawal'; background: var(--surface); color: var(--muted);
  border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }

/* ===== المنتجات ===== */
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 14px 0; }
.section-head h2 { font-size: 1rem; font-weight: 800; }
.section-head span { font-size: 0.75rem; color: var(--muted); }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 12px; padding: 12px 14px 8px;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  overflow: hidden; box-shadow: var(--sh-sm); display: flex; flex-direction: column;
  text-decoration: none; color: var(--text); position: relative; transition: box-shadow .2s, transform .2s;
}
.card:active { transform: scale(0.98); }
@media (hover: hover) { .card:hover { box-shadow: var(--sh-md); } }
.card-img-wrap { position: relative; aspect-ratio: 1 / 1; background: var(--n100); overflow: hidden; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.trend-tag {
  position: absolute; top: 8px; right: 8px; background: var(--primary); color: #fff;
  font-size: 0.66rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
}
.low-tag {
  position: absolute; top: 8px; left: 8px; background: var(--warning); color: #fff;
  font-size: 0.62rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
}
.fav-btn, .quick-add-btn {
  position: absolute; bottom: 8px; width: 32px; height: 32px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--sh-md);
}
.fav-btn { left: 8px; background: rgba(255,255,255,0.95); }
.fav-btn svg { width: 16px; height: 16px; stroke: var(--primary); fill: none; }
.fav-btn.active svg { fill: var(--primary); }
.quick-add-btn { right: 8px; background: var(--primary); border: 2px solid #fff; }
.quick-add-btn svg { width: 16px; height: 16px; stroke: #fff; }
.card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.card-body h3 { font-size: 0.88rem; font-weight: 700; line-height: 1.35; }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.price { color: var(--primary); font-weight: 800; font-size: 0.95rem; }
.unit-pill { font-size: 0.68rem; color: var(--muted); background: var(--n100); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); grid-column: 1/-1; line-height: 1.8; }

.skeleton { pointer-events: none; }
.skeleton .card-img-wrap, .skeleton .sk-line {
  background: linear-gradient(90deg, var(--n100) 25%, #EFE9DA 50%, var(--n100) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite;
}
.sk-line { height: 10px; border-radius: 6px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ===== الفوتر ===== */
.site-footer { text-align: center; padding: 22px 14px 18px; font-size: 0.72rem; color: var(--muted); }
.site-footer .made { margin-top: 4px; font-size: 0.68rem; }
.site-footer .made b { font-family: 'Inter', sans-serif; letter-spacing: 1.5px; color: var(--primary); font-weight: 800; }

/* ===== الشريط السفلي ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(255,255,255,0.97); border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(36,31,23,0.06);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav .inner { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: flex; align-items: stretch; }
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: 0.68rem; font-weight: 500; position: relative;
}
.nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
.nav-item.active { color: var(--primary); font-weight: 700; }
.nav-item.cart .bubble {
  width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center; margin-top: -22px;
  box-shadow: 0 6px 14px rgba(169,130,42,0.35); border: 3px solid var(--bg); position: relative;
}
.nav-item.cart .bubble svg { width: 22px; height: 22px; }
.nav-item.cart .count-dot { top: -4px; left: -4px; background: var(--text); color: #fff; }

.toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 0.82rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // تنظيف أي قيمة قبل حقنها في HTML (حماية من XSS)
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  const SUPABASE_URL = "https://ptahgriuztxqsegkueln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_028EXJwq6WM1uN9z8kDKhw_GKltVWhw";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "crystal_cart";
  const MIN_ORDER = 300; // نفس القيمة في cart.html و checkout.html
  let categoryNames = {};
  // صورة بديلة للمنتج اللي ما عندهش صورة: ماسة خفيفة على خلفية فاتحة
  const NO_IMAGE = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F3E9"/><g fill="none" stroke="#E2D9C3" stroke-width="3" stroke-linejoin="round"><path d="M35 33h30l9 12-24 28-24-28z"/><path d="M26 45h48"/></g></svg>');
  const FAV_KEY = "crystal_favorites";
  let allProducts = [];
  let currentFilter = "all";
  let searchText = "";
  function handleSearch(value) { searchText = value.trim().toLowerCase(); renderGrid(); }
  function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; } }
  function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartBadge(); }
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } }
  function saveFavs(favs) { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); updateFavBadge(); }

  function updateCartBadge() {
    const cart = getCart();
    const total = cart.reduce((s, i) => s + i.quantity, 0);
    const el = document.getElementById("cartCount");
    el.textContent = total;
    el.style.display = total > 0 ? "flex" : "none";
  }
  function updateFavBadge() {
    const favs = getFavs();
    const el = document.getElementById("favCount");
    el.textContent = favs.length;
    el.style.display = favs.length > 0 ? "flex" : "none";
  }

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1500);
  }

  function toggleFav(productId, btnEl) {
    let favs = getFavs();
    if (favs.includes(productId)) {
      favs = favs.filter(id => id !== productId);
      btnEl.classList.remove("active");
    } else {
      favs.push(productId);
      btnEl.classList.add("active");
    }
    saveFavs(favs);
  }

  function quickAdd(product) {
    if (product.hasColors) {
      window.location.href = `product.html?id=${product.id}`;
      return;
    }
    const cart = getCart();
    const existing = cart.find(i => i.product_id === product.id && !i.color);
    if (existing) existing.quantity += 1;
    else cart.push({
      product_id: product.id, name: product.name, price: product.price,
      sale_unit: product.sale_unit, color: null, quantity: 1, image: product.image
    });
    saveCart(cart);
    showToast("تمت الإضافة للسلة ✓");
  }

  // ===== الإشعارات =====
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "c8318950-edb6-4899-bc3b-19189079f1d0" });
    refreshBell(OneSignal);
    OneSignal.Notifications.addEventListener("permissionChange", () => refreshBell(OneSignal));
    OneSignal.User.PushSubscription.addEventListener("change", () => refreshBell(OneSignal));
    window._oneSignal = OneSignal;
  });

  // الجرس يعكس الاشتراك الفعلي (optedIn) مش إذن المتصفح بس:
  // بعد optOut يقعد الإذن مسموح، فلو اعتمدنا على الإذن ما يرجعش الاشتراك أبدًا.
  function refreshBell(OneSignal) {
    const btn = document.getElementById("bellBtn");
    if (OneSignal.User.PushSubscription.optedIn) btn.classList.add("active-bell");
    else btn.classList.remove("active-bell");
  }

  async function toggleBell() {
    const OneSignal = window._oneSignal;
    if (!OneSignal) return;
    if (OneSignal.User.PushSubscription.optedIn) {
      await OneSignal.User.PushSubscription.optOut();
      showToast("تم إيقاف الإشعارات");
    } else {
      if (!OneSignal.Notifications.permission) await OneSignal.Notifications.requestPermission();
      if (OneSignal.Notifications.permission) {
        await OneSignal.User.PushSubscription.optIn();
        showToast("تم تفعيل الإشعارات ✓");
      } else {
        showToast("الإشعارات مقفولة من إعدادات المتصفح");
      }
    }
    refreshBell(OneSignal);
  }

  function renderSkeleton() {
    const card = `<div class="card skeleton"><div class="card-img-wrap"></div><div class="card-body"><div class="sk-line" style="width:80%"></div><div class="sk-line" style="width:45%"></div></div></div>`;
    document.getElementById("productsGrid").innerHTML = card.repeat(6);
  }

  async function init() {
    updateCartBadge();
    updateFavBadge();
    renderSkeleton();
    document.getElementById("footerYear").textContent = new Date().getFullYear();
    document.getElementById("minOrderPerk").textContent = MIN_ORDER;

    const { data: categories } = await supabaseClient.from("categories").select("id, name").eq("active", true).order("sort_order");
    const { data: products, error } = await supabaseClient
      .from("products")
      .select(`id, name, price, sale_unit, is_trending, low_stock, category_id, product_images ( image_url, sort_order ), product_colors ( color_name, active )`)
      .eq("active", true)
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("productsGrid").innerHTML = `<div class="empty">صار خطأ: ${esc(error.message)}</div>`;
      return;
    }

    allProducts = products || [];
    renderChips(categories || []);
    renderGrid();
  }

  function renderChips(categories) {
    const bar = document.getElementById("categoryBar");
    const chips = [{ key: "all", label: "الكل" }, { key: "trending", label: "ترند" }, ...categories.map(c => ({ key: c.id, label: c.name }))];
    chips.forEach(c => { categoryNames[c.key] = c.label; });
    bar.innerHTML = chips.map(c => `<button class="chip ${c.key === currentFilter ? 'active' : ''}" onclick="setFilter('${c.key}', this)">${esc(c.label)}</button>`).join("");
  }

  function setFilter(key, el) {
    currentFilter = key;
    document.querySelectorAll(".chip").forEach(chip => chip.classList.remove("active"));
    el.classList.add("active");
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById("productsGrid");
    const favs = getFavs();

    let filtered;
    if (currentFilter === "all") filtered = allProducts;
    else if (currentFilter === "trending") filtered = allProducts.filter(p => p.is_trending);
    else filtered = allProducts.filter(p => p.category_id === currentFilter);

    if (searchText) {
      filtered = filtered.filter(p => p.name.toLowerCase().includes(searchText));
    }

    document.getElementById("sectionTitle").textContent =
      searchText ? "نتائج البحث" : currentFilter === "all" ? "كل المنتجات" : (categoryNames[currentFilter] || "المنتجات");
    document.getElementById("sectionCount").textContent = filtered.length ? `${filtered.length} منتج` : "";

    if (filtered.length === 0) {
      grid.innerHTML = searchText
        ? `<div class="empty">ما لقيناش منتج بالاسم هذا.<br>جرّب كلمة ثانية.</div>`
        : `<div class="empty">لا توجد منتجات في هذا القسم حاليًا</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const images = (p.product_images || []).sort((a,b) => a.sort_order - b.sort_order);
      const img = images[0]?.image_url || NO_IMAGE;
      const unitLabel = p.sale_unit === "dozen" ? "دستة" : "قطعة";
      const hasColors = (p.product_colors || []).filter(c => c.active).length > 0;
      const isFav = favs.includes(p.id);
      const productData = JSON.stringify({ id: p.id, name: p.name, price: p.price, sale_unit: p.sale_unit, image: img, hasColors });

      return `
        <a href="product.html?id=${p.id}" class="card">
          <div class="card-img-wrap">
            ${p.is_trending ? `<span class="trend-tag">ترند</span>` : ""}
            ${p.low_stock ? `<span class="low-tag">آخر القطع</span>` : ""}
            <img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">
            <button class="fav-btn ${isFav ? 'active' : ''}" aria-label="المفضلة" onclick="event.preventDefault(); toggleFav('${p.id}', this)">
              <svg viewBox="0 0 24 24" stroke-width="2"><path d="M20.8 4.6a5 5 0 00-7.1 0L12 6.3l-1.7-1.7a5 5 0 00-7.1 7.1l1.7 1.7L12 20.6l7.1-7.1 1.7-1.7a5 5 0 000-7.1z"/></svg>
            </button>
            <button class="quick-add-btn" aria-label="أضف للسلة" onclick='event.preventDefault(); quickAdd(${esc(productData)})'>
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div class="card-body">
            <h3>${esc(p.name)}</h3>
            <div class="price-row">
              <div class="price"><span class="en">${esc(p.price)}</span> د.ل</div>
              <span class="unit-pill">${unitLabel}</span>
            </div>
          </div>
        </a>
      `;
    }).join("");
  }

  init();
</script>

</body>
</html>
